name: CI

on:
  push:
    branches:
      - pre-release
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared (for tests)
        working-directory: shared
        run: npx tsc

      - name: Run tests
        run: npm test

  build:
    name: Build (Render-style build)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Build all workspaces (root)
        run: npm run build

      - name: Move client build to server (postbuild)
        run: |
          rm -rf server/dist
          mv client/dist server/dist

      - name: Move assets to server public (postbuild)
        run: |
          mkdir -p server/public
          rm -rf server/public/assets
          if [ -d server/dist/assets ]; then mv server/dist/assets server/public/assets; fi

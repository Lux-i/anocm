name: CI

on:
  push:
    branches:
      - pre-release
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared (for tests)
        working-directory: shared
        run: npx tsc

      - name: Run tests
        run: npm test

  build:
    name: Build (full application)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        working-directory: shared
        run: npx tsc

      - name: Build server
        working-directory: server
        run: npx tsc

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Move client build to server
        run: |
          rm -rf server/dist
          mv client/dist server/dist

      - name: Move assets to server public
        run: |
          rm -rf server/public/assets
          mv server/dist/assets server/public/assets
